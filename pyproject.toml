[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evapro"
version = "0.1.0"
description = "Benchmarking molecular transfer learning on curated CVA16 2A protease affinities"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scipy==1.18.1",
    "scikit-learn==1.9.0",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
    "requests==2.34.2",
    "tqdm==4.70.0",
    "rdkit==2026.3.6",
]

[project.optional-dependencies]
deep = ["torch==2.13.0", "transformers==5.16.1", "chemprop==2.3.1"]
repro = ["torch==2.13.0", "transformers==5.16.1", "chemprop==2.3.1",
         "pytest==9.1.1", "matplotlib==3.11.1", "nbstripout==0.9.1"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.4", "nbstripout", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
