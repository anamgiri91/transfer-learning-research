[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evapro"
version = "0.1.0"
description = "Benchmarking transfer learning on high-fidelity EV-A71 protease datasets"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "tqdm>=4.66",
    "rdkit>=2023.9",
    "lightgbm>=4.1",
]

[project.optional-dependencies]
deep = ["torch>=2.2", "transformers>=4.40", "peft>=0.10"]
dev = ["pytest>=8", "pytest-cov", "ruff>=0.4", "nbstripout", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
