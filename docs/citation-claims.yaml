# Claim-support register.
#
# verify_citations.py checks that citations are structurally sound: numbered,
# labelled, cited, not orphaned. What it cannot check is whether a source
# actually SAYS what we claim it says. That is what caught us out on
# 2026-09-02: the ~50-molecule crossover was attributed to two papers, and
# finding the real source meant reading a third paper's discussion section.
#
# So every number this manuscript takes from someone else's work is recorded
# here with the verbatim sentence that supports it, where that sentence was
# read, and when. The checker then enforces:
#
#   - the quoted sentence actually contains the quantity we claim from it
#   - the claim still appears in the manuscript (the register cannot drift)
#   - a quote read in a DIFFERENT work from the one cited is declared
#     second-hand, rather than silently passed off as first-hand. This is
#     decided by comparing quote_source_url against source_url, not by
#     guessing from prose.
#   - every number-carrying citation in the body has an entry here
#
# status: verified   quote retrieved and checked on `retrieved`
#         superseded no longer relied on; kept so the history is legible
#
# This register covers ONLY numbers taken from other papers. Numbers derived
# from our own artefacts are checked by verify_manuscript.py instead.

- id: crossover-50
  quote_source_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12076497/
  attributed_to: "Snyder et al. 2024"
  source_url: https://www.nature.com/articles/s42004-024-01220-4
  quantity: "50"
  claim_in_manuscript: "from roughly 50 measured\nmolecules upward"
  quote: "from 50 measures molecules upward, classic machine learning methods start outperforming few-shot learning methods"
  quote_read_in: "Schimunek et al. 2025, Discussion (PMC12076497), quoting Snyder et al. 2024"
  second_hand: true
  retrieved: 2026-09-02
  status: verified
  note: >
    The error that motivated this register. Previously attributed to
    Altae-Tran 2017 and Schimunek 2025; it is neither's. It is load-bearing:
    it is why the learning curves start at exactly n = 50.

