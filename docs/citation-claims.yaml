- id: lithgo-five-residues
  quote_source_url: https://doi.org/10.1101/2024.04.29.591684
  attributed_to: "Lithgo et al. 2024"
  source_url: https://doi.org/10.1101/2024.04.29.591684
  quantity: "five"
  claim_in_manuscript: "differ at five amino acids"
  quote: "The 2A^pro sequence of EV-A71 and CVA16 differ by 5 amino acids, none of which are near or predicted to affect [the active site]"
  quote_read_in: "docs/literature.md §1.1, recorded from a full-text read on 2026-09-01"
  second_hand: false
  retrieved: 2026-09-01
  status: superseded
  note: >
    Could not be re-retrieved during the audit: the sentence is in bioRxiv body
    text, which rate-limited us, and there is no PMC mirror. Rather than rely
    on it, §3.1 now re-derives the comparison from UniProt-annotated 2A chains
    (scripts/verify_surrogate.py). That check does not reproduce the count of
    five (7 and 8 against the reviewed reference strains) but does confirm the
    substantive claim that no catalytic residue differs. Retained as
    superseded so the provenance of the change is legible.
